questions:
  - id: q_geometric_3street
    type: parametric
    stem_template: "The pot is ${{pot}}, effective stacks are ${{stacks_mult}} times the pot (so ${{pot * stacks_mult}} behind), and there are {{streets}} streets remaining. Using geometric sizing to grow the pot to one stack by the river, what percentage of the current pot should you bet on this street?"
    params:
      pot: { min: 100, max: 300, step: 50 }
      stacks_mult: { min: 2, max: 8, step: 1 }
      streets: { min: 2, max: 3, step: 1 }
    correct_formula: "Math.round((Math.pow(stacks_mult, 1/streets) - 1) / 2 * 100)"
    distractor_formulas:
      - "Math.round((stacks_mult / streets - 1) / 2 * 100)"
      - "50"
      - "Math.round((Math.pow(stacks_mult, 1/streets) - 1) * 100)"
    answer_suffix: "% of pot"
    explanation_template: >-
      Geometric ratio g = SPR^(1/streets) = {{stacks_mult}}^(1/{{streets}}) = {{Math.round(Math.pow(stacks_mult,1/streets)*100)/100}}.
      Bet = (g − 1) / 2 × pot = ({{Math.round(Math.pow(stacks_mult,1/streets)*100)/100}} − 1) / 2 = {{Math.round((Math.pow(stacks_mult,1/streets)-1)/2*100)}}% of the current pot.
      After {{streets}} streets the pot grows by factor g^{{streets}} = SPR, reaching the commitment point where pot equals one starting stack.

  - id: q_mdf_bet_pct
    type: parametric
    stem_template: "You face a bet of {{bet_pct}}% of the pot (so if the pot is \\$100, the bet is ${{bet_pct}}). What is your MDF — the minimum fraction of your range you must continue with?"
    params:
      bet_pct: { min: 25, max: 150, step: 25 }
    correct_formula: "Math.round(100 / (100 + bet_pct) * 100)"
    distractor_formulas:
      - "Math.round(bet_pct / (100 + bet_pct) * 100)"
      - "Math.round(100 / (100 + 2 * bet_pct) * 100)"
      - "50"
    answer_suffix: "%"
    explanation_template: >-
      With pot = \$100 and bet = ${{bet_pct}}, MDF = pot / (pot + bet) = 100 / (100 + {{bet_pct}}) = 100 / {{100 + bet_pct}} = {{Math.round(100/(100+bet_pct)*100)}}%.
      As the bet size rises, MDF falls — larger bets require the defender to protect a smaller but stronger fraction of their range.

  - id: q_geometric_spr8
    type: multiple_choice
    stem: "The pot is \\$200 and effective stacks are \\$1,600 (SPR = 8). There are 3 streets remaining (flop, turn, river). What is the geometric bet size on the flop?"
    options:
      - "\\$133 (67% pot)"
      - "\\$100 (50% pot)"
      - "\\$200 (pot-sized)"
      - "\\$67 (33% pot)"
    correct: 1
    explanation: >-
      g = 8^(1/3) = 2.0. Bet = (2.0 − 1) / 2 × \$200 = 0.5 × \$200 = \$100 (50% pot).
      After the call, pot = \$400. Turn bet = 0.5 × \$400 = \$200. After call, pot = \$800. River bet = 0.5 × \$800 = \$400 — the pot is now \$1,600 (= one starting stack), the commitment point where the next pot-sized bet would shove.

  - id: q_polarised_vs_merged
    type: multiple_choice
    stem: "You are on the river and your betting range consists almost entirely of strong flushes and weak bluffs with no showdown value. Which bet size is most appropriate?"
    options:
      - "Small bet (25–33% pot) to maximise the number of hands that call"
      - "Large bet (75–150% pot) to maximise value from your strong hands and fold equity from bluffs"
      - "Check — polarised ranges should never bet the river"
      - "Half-pot bet — always a safe middle ground regardless of range"
    correct: 1
    explanation: >-
      A polarised range (nuts + bluffs, no medium hands) benefits from large bets. Large bets extract maximum value from the few hands that call your strong hands, and generate high fold equity so your bluffs win the pot more often.
      A small bet would invite calls from hands that beat your bluffs but lose to your value hands — the worst outcome.

  - id: q_merged_sizing
    type: multiple_choice
    stem: "Your river betting range is primarily top pair and strong two pair with few bluffs. Which size maximises your EV?"
    options:
      - "Large overbet (150%+ pot) to build the pot"
      - "Small bet (25–33% pot) to get called by hands you beat"
      - "Pot-sized bet to apply maximum pressure"
      - "Check — merged ranges should not bet the river"
    correct: 1
    explanation: >-
      A merged (linear) range uses small bets. A small bet gets called by top pair worse, two pair worse, and other hands you beat. A large bet would fold everything you beat and get called only by hands that beat you — exactly the wrong outcome.

  - id: q_overbet_bluff_pct
    type: multiple_choice
    stem: "You make a 2× pot overbet on the river. To keep your betting range balanced (making villain indifferent to calling or folding), approximately what fraction of your betting range must be bluffs?"
    options:
      - "33% — one bluff for every two value combos"
      - "40% — two bluffs for every three value combos"
      - "50% — one bluff for every value combo"
      - "67% — two bluffs for every value combo"
    correct: 1
    explanation: >-
      Bluff share = B / (P + 2B) = 2P / (P + 4P) = 2/5 = 40%. Equivalently value:bluff = (P+B):B = 3P:2P = 3:2 — three value combos for every two bluffs.
      The classic mistake is to answer 67%, which is alpha (B/(P+B), the defender's max fold frequency) — not the bluff share of the betting range.
      Overbets still demand many bluffs, so they are only viable when you hold a large number of strong bluff candidates (e.g. missed draws that block villain's calling range).

  - id: q_geometric_tf
    type: true_false
    stem: "True or false: under geometric sizing, the bet-as-percent-of-pot fraction is the same on every street regardless of how SPR and the number of remaining streets combine."
    correct: false
    explanation: >-
      False. The bet fraction per street is (g − 1) / 2, where g = SPR^(1/n). This fraction depends on SPR and n: a 50% pot bet (g = 2) corresponds to SPR = 4 with 2 streets, or SPR = 8 with 3 streets — different SPR/streets combinations produce different g and therefore different bet fractions. The fraction is consistent across streets within a single geometric plan, but it changes whenever SPR or n changes.

  - id: q_protection_tf
    type: true_false
    stem: "True or false: a protection bet is made primarily to extract value from worse hands, not to deny equity to drawing hands."
    correct: false
    explanation: >-
      False. A protection bet's primary purpose is to deny equity — to make it unprofitable (or at least more expensive) for drawing hands to see another card.
      Value extraction from worse made hands is a side benefit; protection bets are typically small (25–33% pot) precisely because the main goal is to charge draws, not to build the pot.

  - id: q_oop_sizing
    type: multiple_choice
    stem: "You are out of position (OOP) on the flop with a merged range. Which sizing principle applies?"
    options:
      - "Use large bets — OOP should always apply pressure to compensate for positional disadvantage"
      - "Use small bets — OOP should default to small sizes to avoid being exploited by raises and to get value from a wide calling range"
      - "Never bet OOP — always check and let the IP player bet"
      - "Use pot-sized bets exclusively — the standard GTO OOP size"
    correct: 1
    explanation: >-
      OOP players generally prefer smaller bet sizes. A large OOP bet is hard to balance across all boards and risks a check-raise that forces a difficult decision. Small bets keep the pot manageable, get called by a wider range, and preserve positional parity for future streets.
      This is especially true for merged ranges: small bets extract value from all the hands you beat.
