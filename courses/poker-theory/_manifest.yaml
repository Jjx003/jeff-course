track: poker-theory
story_notes: >-
  The student arrives knowing how to play poker but making decisions by feel.
  They leave with a rigorous mathematical framework for every spot: they can
  calculate pot odds and equity on the fly, construct balanced ranges, derive
  the minimum-defense frequency for any bet size, and understand why GTO
  strategies exist and when to deviate. The narrative thread is EV-maximization
  — every concept (combinatorics, ranges, GTO, MDF, bet sizing, board texture,
  ICM) is shown to be a direct consequence of maximising expected value. Eight
  reading modules anchor the theory; eight interleaved quiz modules drill the
  calculations with fresh randomised numbers on every attempt; a capstone
  reading module ties everything into a practical study framework.
