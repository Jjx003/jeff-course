questions:
  - id: q1
    type: multiple_choice
    stem: "What does a GTO (Nash equilibrium) strategy **guarantee** for the player using it?"
    options:
      - "The maximum possible EV in every session"
      - "A floor EV that cannot be reduced by any opponent strategy"
      - "Guaranteed profit against any opponent"
      - "The same EV as an exploitative strategy against weak players"
    correct: 1
    explanation: "GTO guarantees that no opponent can exploit you — your EV is at least the Nash equilibrium value of the game. It does not maximise EV against opponents who make mistakes (exploitative play does that), and it does not guarantee profit (you can still lose to variance). It is a floor, not a ceiling."

  - id: q2
    type: true_false
    stem: "Playing a GTO strategy maximises your EV against an opponent who always folds to river bets."
    correct: false
    explanation: "GTO is the best response to a GTO opponent. Against an opponent who always folds to river bets, the maximally exploitative response is to bluff 100% of your betting range — far more than GTO prescribes. GTO leaves significant EV on the table against predictable, exploitable opponents."

  - id: q3
    type: multiple_choice
    stem: "A GTO strategy requires **mixed strategies** (randomisation). What does this mean in practice?"
    options:
      - "You should play the same hand the same way every time to stay consistent"
      - "You should randomly pick any action — the exact frequencies don't matter"
      - "You randomise between actions with the same hand at specific frequencies that prevent exploitation"
      - "You should randomise only when you are uncertain about your hand's strength"
    correct: 2
    explanation: "Mixed strategies require choosing between actions (e.g. bet or check) with specific, calculated probabilities — not arbitrary randomness. The frequencies are determined by the indifference principle: they must make the opponent indifferent between their options. Playing every hand the same way is a pure strategy and is always exploitable."

  - id: q4
    type: true_false
    stem: "At a GTO equilibrium river node where you are mixing between betting and checking with a hand, the EV of betting and the EV of checking are equal for that hand."
    correct: true
    explanation: "This is the defining property of a mixed-strategy Nash equilibrium: at any node where a player mixes between two actions, those actions must have equal EV (otherwise the player would strictly prefer one and play it 100% of the time — a pure strategy). The mixing frequency is exactly what equalises the two EVs."

  - id: q5
    type: multiple_choice
    stem: "In rock-paper-scissors, the GTO (Nash equilibrium) strategy is to play each action with what probability?"
    options:
      - "50% Rock, 25% Paper, 25% Scissors"
      - "1/3 Rock, 1/3 Paper, 1/3 Scissors"
      - "100% of whichever action beat the opponent's last move"
      - "Any fixed pure strategy is equally good"
    correct: 1
    explanation: "The unique Nash equilibrium in RPS is to play each action with equal probability 1/3. Any deviation from this (e.g. Rock 50%) allows the opponent to exploit it by always playing Paper. Playing 1/3 each makes the opponent's EV from any action exactly 0, regardless of their strategy."

  - id: q6
    type: multiple_choice
    stem: "You observe that villain **always folds** when you bet the river. Relative to GTO, what is the maximally exploitative adjustment?"
    options:
      - "Continue bluffing at the GTO frequency — deviation is risky"
      - "Stop bluffing entirely, since villain folds anyway"
      - "Increase your bluff frequency beyond GTO — villain cannot profitably call"
      - "Decrease your value-bet frequency, since folds are as good as calls"
    correct: 2
    explanation: "If villain always folds, every bet wins the pot regardless of your hand. The exploitative response is to bluff as much as possible — in the extreme, bet 100% of your range as a bluff. GTO would bluff only B/(P+2B) of the betting range; the exploitative strategy bluffs far more because the fold EV is guaranteed."

  - id: q7
    type: multiple_choice
    stem: "\"Playing unexploitably\" means:"
    options:
      - "You will always profit from every hand you play"
      - "Your opponent cannot gain extra EV above the Nash equilibrium value by deviating from their own GTO strategy"
      - "You never bluff, so villain can never catch you with air"
      - "You always call, so villain can never steal pots"
    correct: 1
    explanation: "Unexploitable means there is no deviation an opponent can make that increases their EV beyond what GTO gives them. If they call more, your extra bluffs lose; if they fold more, your value bets win uncontested. Both deviations are equally bad for them when you play GTO frequencies."

  - id: q_bluff_freq
    type: parametric
    stem_template: "The pot is ${{pot}} before the river. Hero bets ${{bet}}. What percentage of Hero's betting range should be **bluffs** to make Villain exactly indifferent between calling and folding? (Round to the nearest whole percent.)"
    params:
      pot: { min: 40, max: 200, step: 20 }
      bet: { min: 20, max: 120, step: 20 }
    correct_formula: "Math.round(bet / (pot + 2 * bet) * 100)"
    distractor_formulas:
      - "Math.round(bet / (pot + bet) * 100)"
      - "Math.round(pot / (pot + bet) * 100)"
      - "Math.round(pot / (2 * pot + bet) * 100)"
    answer_suffix: "%"
    explanation_template: >-
      Indifference condition: EV(call) = EV(fold) = 0. When Villain calls and Hero is bluffing,
      Villain wins the pot **plus** Hero's bet (${{pot}} + ${{bet}} = ${{pot + bet}}); when Hero has value, Villain loses the ${{bet}} call.
      EV(call) = p_bluff × ${{pot + bet}} − (1 − p_bluff) × ${{bet}} = 0.
      Solving: p_bluff = {{bet}} / ({{pot}} + 2×{{bet}}) = {{bet}} / {{pot + 2 * bet}} = {{Math.round(bet / (pot + 2 * bet) * 100)}}%.
      This is exactly the pot odds Villain is being laid — the bluff share that makes calling break even.
      (Note: this is NOT alpha = {{Math.round(bet/(pot+bet)*100)}}%; alpha is the defender's max fold frequency, a different quantity.)

  - id: q_value_bluff_ratio
    type: parametric
    stem_template: "Pot = ${{pot}}, river bet = ${{bet}}. At GTO, the value-to-bluff ratio in Hero's betting range is (P+B) : B = {{pot + bet}} : {{bet}}. If Hero has {{n}} bluff combos in their betting range, how many **value combos** should they have? (Round to the nearest whole number.)"
    params:
      pot: { min: 40, max: 160, step: 20 }
      bet: { min: 20, max: 100, step: 20 }
      n: { min: 2, max: 8, step: 1 }
    correct_formula: "Math.round(n * (pot + bet) / bet)"
    distractor_formulas:
      - "Math.round(n * pot / bet)"
      - "Math.round(n * bet / (pot + bet))"
      - "n"
    answer_suffix: " value combos"
    explanation_template: >-
      At GTO, value combos / bluff combos = (P + B) / B = {{pot + bet}} / {{bet}} (this is the price the caller is laid).
      With {{n}} bluff combos: value combos = {{n}} × {{pot + bet}} / {{bet}} = {{Math.round(n * (pot + bet) / bet)}}.
      Check: bluff share = {{n}} / ({{n}} + {{Math.round(n * (pot + bet) / bet)}}) ≈ {{Math.round(bet / (pot + 2 * bet) * 100)}}%, which matches B/(P+2B).
