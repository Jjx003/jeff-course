questions:
  - id: q1
    type: true_false
    stem: "Any prime $p \equiv 1 \pmod{4}$ can be written as the sum of two squares."
    correct: true
    explanation: "This is a direct statement of Fermat's Theorem on sums of two squares. For example, $5 = 1^2 + 2^2$ and $13 = 2^2 + 3^2$."

  - id: q2
    type: multiple_choice
    stem: "Which of the following integers cannot be written as the sum of two squares?"
    options: ["20", "45", "21", "65"]
    correct: 2
    explanation: "An integer $n$ can be expressed as the sum of two squares if and only if every prime factor $p \equiv 3 \pmod{4}$ in its prime factorization occurs to an even power. The prime factorization of $21$ is $3 \times 7$. Here, both $3 \equiv 3 \pmod{4}$ and $7 \equiv 3 \pmod{4}$ appear with an odd exponent ($1$). Thus, $21$ cannot be written as the sum of two squares."

  - id: q3
    type: true_false
    stem: "According to Lagrange's Four-Square Theorem, every positive integer can be written as the sum of exactly four non-zero squares."
    correct: false
    explanation: "The theorem states that every positive integer can be written as the sum of four squares, but some of those squares might be zero. For example, $3 = 1^2 + 1^2 + 1^2 + 0^2$. It does not require the squares to be strictly positive."

  - id: q4
    type: multiple_choice
    stem: "If $n$ can be written as the sum of two squares, and $m$ can be written as the sum of two squares, what can be said about their product $nm$?"
    options:
      - "It can always be written as the sum of two squares."
      - "It can be written as the sum of two squares only if $n$ and $m$ are coprime."
      - "It can be written as the sum of four squares, but not necessarily two squares."
      - "None of the above."
    correct: 0
    explanation: "This follows from the Brahmagupta–Fibonacci identity (or Diophantus identity): $(a^2 + b^2)(c^2 + d^2) = (ac - bd)^2 + (ad + bc)^2$. Thus, the product of two sums of two squares is always a sum of two squares."