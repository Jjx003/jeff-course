title: "Modular Arithmetic Speed Drill"
instructions: "Answer with the least nonnegative residue."
roundSeconds: 120
targetAccuracy: 0.85
itemsPerRound: 20
items:
  - id: linear_residue
    prompt_template: "Compute ({{a}} + {{b}}) mod {{m}}."
    params:
      a: { min: 20, max: 180, step: 1 }
      b: { min: 20, max: 180, step: 1 }
      m: { min: 5, max: 19, step: 1 }
    correct_formula: "(a + b) % m"
    tolerance: 0
    explanation_template: "{{a}} + {{b}} = {{a + b}}, and {{a + b}} mod {{m}} is {{(a + b) % m}}."
  - id: product_residue
    prompt_template: "Compute ({{a}} × {{b}}) mod {{m}}."
    params:
      a: { min: 3, max: 29, step: 1 }
      b: { min: 3, max: 29, step: 1 }
      m: { min: 5, max: 23, step: 1 }
    correct_formula: "(a * b) % m"
    tolerance: 0
    explanation_template: "Reduce the product {{a * b}} modulo {{m}}."
