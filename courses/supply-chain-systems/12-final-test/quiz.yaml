questions:
  - id: q_system_objective
    type: multiple_choice
    stem: "A purchasing team cuts unit price by moving to a distant supplier, but lead time doubles and safety stock rises. What is the best first critique?"
    options:
      - "The decision should be evaluated on total system cost and service impact, not unit price alone"
      - "Lower unit price is always globally optimal"
      - "Longer lead time always reduces inventory"
      - "Safety stock is unrelated to sourcing"
    correct: 0
    explanation: "Sourcing decisions affect inventory, service, risk, logistics, and working capital."

  - id: q_newsvendor
    type: parametric
    stem_template: "Underage cost is {{cu}} dollars per unit and overage cost is {{co}} dollars per unit. What is the critical fractile percentage?"
    params:
      cu: { min: 20, max: 80, step: 20 }
      co: { min: 10, max: 40, step: 10 }
    correct_formula: "Math.round(100 * cu / (cu + co))"
    distractor_formulas:
      - "Math.round(100 * co / (cu + co))"
      - "Math.round(cu + co)"
      - "Math.round(100 * cu / co)"
    answer_suffix: "%"
    explanation_template: "Critical fractile = Cu / (Cu + Co) = {{cu}} / ({{cu}} + {{co}}), or about {{Math.round(100 * cu / (cu + co))}}%."

  - id: q_bottleneck
    type: multiple_choice
    stem: "A supplier can produce 1,000 units, the plant can assemble 900, and outbound transport can ship 700. Ignoring all other constraints, what should operations improve first?"
    options:
      - "Outbound transport, because it is the binding constraint"
      - "Supplier capacity, because it is already largest"
      - "Plant capacity, because every non-bottleneck must be maximized first"
      - "Forecasting, because capacity numbers never matter"
    correct: 0
    explanation: "Throughput is constrained by the scarcest required capability."

  - id: q_dual_sourcing
    type: true_false
    stem: "Dual sourcing is valuable only when the alternate supplier is qualified and operationally ready, not merely named in a plan."
    correct: true
    explanation: "Correct. A backup supplier must be usable under real operating conditions."

  - id: q_mrp
    type: parametric
    stem_template: "A finished product uses {{qty}} components per unit. The plan builds {{build}} units and expected scrap is {{scrap}}%. Ignoring inventory, how many components should be planned? Round to the nearest whole component."
    params:
      qty: { min: 2, max: 6, step: 1 }
      build: { min: 100, max: 500, step: 100 }
      scrap: { min: 5, max: 15, step: 5 }
    correct_formula: "Math.round(qty * build * (1 + scrap / 100))"
    distractor_formulas:
      - "Math.round(qty * build)"
      - "Math.round(qty + build + scrap)"
      - "Math.round(qty * build * scrap / 100)"
    answer_suffix: " components"
    explanation_template: "Gross component demand with scrap allowance = {{qty}} x {{build}} x (1 + {{scrap}}/100) = {{Math.round(qty * build * (1 + scrap / 100))}}."

  - id: q_resilience_ev
    type: parametric
    stem_template: "A disruption has annual probability {{p}}% and impact USD {{impact}} million. What is expected annual loss in USD thousands?"
    params:
      p: { min: 5, max: 25, step: 5 }
      impact: { min: 2, max: 10, step: 2 }
    correct_formula: "Math.round(p * impact * 10)"
    distractor_formulas:
      - "Math.round(p + impact)"
      - "Math.round(p * impact)"
      - "Math.round(impact * 1000 / p)"
    answer_suffix: " thousand"
    explanation_template: "Expected loss = {{p}}% x USD {{impact}} million = USD {{Math.round(p * impact * 10)}} thousand."

  - id: q_sustainability
    type: multiple_choice
    stem: "Why are functional units important in sustainability analysis?"
    options:
      - "They make comparisons meaningful, such as emissions per delivered case or per usable hour"
      - "They eliminate the need for supplier data"
      - "They prove air freight is always bad"
      - "They convert all scope 3 emissions into scope 1"
    correct: 0
    explanation: "Functional units keep comparisons tied to the service or output delivered."

  - id: q_service_metric
    type: multiple_choice
    stem: "Which statement correctly distinguishes cycle service level from fill rate?"
    options:
      - "Cycle service level is the probability of no stockout in a cycle; fill rate is the fraction of demand filled immediately"
      - "They are always identical"
      - "Fill rate measures supplier profit"
      - "Cycle service level only applies to transportation routes"
    correct: 0
    explanation: "The two service metrics answer different operational questions."
