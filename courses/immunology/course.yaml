title: "Immunology: From Recognition to Immune Engineering"
slug: "immunology"
description: >
  Build a mechanistic model of the immune system from barriers and antigen
  recognition through tolerance, disease, vaccines, cancer immunotherapy,
  engineered cell therapies, structural immunology, and computational immunology. Case studies,
  figures, cumulative tests, and a research-review capstone connect molecular
  mechanisms to clinical decisions and current research.
