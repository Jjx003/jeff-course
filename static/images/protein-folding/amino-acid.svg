<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
<defs>
<linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#f8fafc"/></linearGradient>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.1"/></filter>
</defs>
<rect width="400" height="300" rx="16" fill="url(#bg)" stroke="#e2e8f0" stroke-width="1"/>
<text x="200" y="40" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">General Amino Acid Structure</text>
<line x1="200" y1="150" x2="100" y2="150" stroke="#94a3b8" stroke-width="4"/>
<line x1="200" y1="150" x2="300" y2="150" stroke="#94a3b8" stroke-width="4"/>
<line x1="200" y1="150" x2="200" y2="70" stroke="#94a3b8" stroke-width="4"/>
<line x1="200" y1="150" x2="200" y2="230" stroke="#94a3b8" stroke-width="4"/>
<circle cx="200" cy="150" r="24" fill="#475569" filter="url(#shadow)"/>
<text x="200" y="156" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Cα</text>
<circle cx="100" cy="150" r="30" fill="#3b82f6" filter="url(#shadow)"/>
<text x="100" y="156" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">NH3+</text>
<text x="100" y="195" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#3b82f6" text-anchor="middle">Amino Group</text>
<circle cx="300" cy="150" r="30" fill="#ef4444" filter="url(#shadow)"/>
<text x="300" y="156" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">COO-</text>
<text x="300" y="195" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#ef4444" text-anchor="middle">Carboxyl Group</text>
<circle cx="200" cy="70" r="20" fill="#94a3b8" filter="url(#shadow)"/>
<text x="200" y="76" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">H</text>
<rect x="170" y="230" width="60" height="40" rx="8" fill="#10b981" filter="url(#shadow)"/>
<text x="200" y="256" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">R</text>
<text x="200" y="285" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#10b981" text-anchor="middle">Side Chain</text>
</svg>