<svg width="500" height="250" viewBox="0 0 500 250" xmlns="http://www.w3.org/2000/svg">
  <rect width="500" height="250" fill="#1a472a" rx="15" /> <!-- Green Table -->
  <text x="250" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#fff">Board Texture & Bet Sizing</text>
  
  <!-- Dry Board -->
  <g transform="translate(50, 60)">
    <rect width="180" height="120" fill="rgba(255,255,255,0.1)" rx="10" stroke="#fff" stroke-dasharray="5,5" />
    <text x="90" y="30" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#fff">Dry (A-7-2r)</text>
    <!-- Cards -->
    <rect x="20" y="50" width="40" height="55" fill="#fff" rx="4" />
    <rect x="70" y="50" width="40" height="55" fill="#fff" rx="4" />
    <rect x="120" y="50" width="40" height="55" fill="#fff" rx="4" />
    <text x="90" y="115" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#00ff00">Small sizing (1/3 pot)</text>
  </g>
  
  <!-- Wet Board -->
  <g transform="translate(270, 60)">
    <rect width="180" height="120" fill="rgba(255,255,255,0.1)" rx="10" stroke="#fff" stroke-dasharray="5,5" />
    <text x="90" y="30" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#fff">Wet (9-8-7ss)</text>
    <!-- Cards -->
    <rect x="20" y="50" width="40" height="55" fill="#fff" rx="4" />
    <rect x="70" y="50" width="40" height="55" fill="#fff" rx="4" />
    <rect x="120" y="50" width="40" height="55" fill="#fff" rx="4" />
    <text x="90" y="115" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#ffcc00">Large sizing (3/4+ pot)</text>
  </g>
</svg>
