<svg width="400" height="200" viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="200" fill="#f8f9fa" rx="10"/>
  <text x="20" y="40" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#333">Rule of 4 vs. Exact Equity</text>
  
  <!-- Grid -->
  <line x1="50" y1="160" x2="350" y2="160" stroke="#ccc" />
  <line x1="50" y1="160" x2="50" y2="60" stroke="#ccc" />
  
  <!-- Data Points (approximate positions) -->
  <!-- 4 outs: 16% vs 16.5% -->
  <circle cx="80" cy="144" r="4" fill="#007bff" /> <!-- Rule -->
  <circle cx="80" cy="143.5" r="3" fill="#dc3545" /> <!-- Exact -->
  
  <!-- 8 outs: 32% vs 31.5% -->
  <circle cx="150" cy="128" r="4" fill="#007bff" /> <!-- Rule -->
  <circle cx="150" cy="128.5" r="3" fill="#dc3545" /> <!-- Exact -->
  
  <!-- 12 outs: 48% vs 45.0% -->
  <circle cx="220" cy="112" r="4" fill="#007bff" /> <!-- Rule -->
  <circle cx="220" cy="115" r="3" fill="#dc3545" /> <!-- Exact -->
  
  <!-- 15 outs: 60% vs 54.1% -->
  <circle cx="290" cy="100" r="4" fill="#007bff" /> <!-- Rule -->
  <circle cx="290" cy="106" r="3" fill="#dc3545" /> <!-- Exact -->
  
  <!-- Legend -->
  <rect x="250" y="20" width="10" height="10" fill="#007bff" />
  <text x="265" y="30" font-family="Arial, sans-serif" font-size="12" fill="#333">Rule of 4</text>
  <rect x="250" y="40" width="10" height="10" fill="#dc3545" />
  <text x="265" y="50" font-family="Arial, sans-serif" font-size="12" fill="#333">Exact</text>
  
  <text x="180" y="180" font-family="Arial, sans-serif" font-size="12" fill="#666">Number of Outs</text>
  <text x="10" y="110" font-family="Arial, sans-serif" font-size="12" fill="#666" transform="rotate(-90 10 110)">Equity %</text>
</svg>
