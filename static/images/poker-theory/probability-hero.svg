<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0e0e0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Card Background -->
  <rect x="40" y="20" width="120" height="160" rx="10" fill="url(#cardGrad)" stroke="#333" stroke-width="2"/>
  
  <!-- Ace of Spades Symbol -->
  <path d="M100 50 C 110 80, 140 90, 100 130 C 60 90, 90 80, 100 50 Z" fill="#000" />
  <path d="M100 130 L 90 150 L 110 150 Z" fill="#000" />
  
  <!-- "A" Letter -->
  <text x="55" y="50" font-family="Georgia, serif" font-size="24" font-weight="bold" fill="#000">A</text>
  <text x="145" y="170" font-family="Georgia, serif" font-size="24" font-weight="bold" fill="#000" transform="rotate(180 145 170)">A</text>
  
  <!-- Decorative Circles -->
  <circle cx="30" cy="30" r="10" fill="#dc3545" opacity="0.6"/>
  <circle cx="170" cy="170" r="15" fill="#007bff" opacity="0.6"/>
</svg>
