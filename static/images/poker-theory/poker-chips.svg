<svg width="400" height="100" viewBox="0 0 400 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" />
      <feOffset dx="2" dy="2" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Red Chip -->
  <g filter="url(#shadow)" transform="translate(50, 50)">
    <circle cx="0" cy="0" r="40" fill="#dc3545" stroke="#fff" stroke-width="2" />
    <circle cx="0" cy="0" r="30" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="10,10" />
    <text x="0" y="7" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#fff">5</text>
  </g>
  
  <!-- Blue Chip -->
  <g filter="url(#shadow)" transform="translate(130, 50)">
    <circle cx="0" cy="0" r="40" fill="#007bff" stroke="#fff" stroke-width="2" />
    <circle cx="0" cy="0" r="30" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="10,10" />
    <text x="0" y="7" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#fff">10</text>
  </g>
  
  <!-- Black Chip -->
  <g filter="url(#shadow)" transform="translate(210, 50)">
    <circle cx="0" cy="0" r="40" fill="#333" stroke="#fff" stroke-width="2" />
    <circle cx="0" cy="0" r="30" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="10,10" />
    <text x="0" y="7" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#fff">100</text>
  </g>
  
  <!-- Green Chip -->
  <g filter="url(#shadow)" transform="translate(290, 50)">
    <circle cx="0" cy="0" r="40" fill="#28a745" stroke="#fff" stroke-width="2" />
    <circle cx="0" cy="0" r="30" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="10,10" />
    <text x="0" y="7" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#fff">25</text>
  </g>
</svg>
