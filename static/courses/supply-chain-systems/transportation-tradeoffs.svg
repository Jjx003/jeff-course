<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Transportation tradeoffs</title>
  <desc id="desc">A chart comparing transportation modes by relative speed, cost, flexibility, and emissions intensity.</desc>
  <rect width="1200" height="720" fill="#f8fafc"/>
  <rect x="64" y="54" width="1072" height="612" rx="24" fill="#ffffff" stroke="#d8e0ea"/>
  <text x="94" y="110" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#152033">Transportation mode tradeoffs</text>
  <text x="94" y="145" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" fill="#526273">Mode choice changes speed, cost, reliability, inventory, and emissions.</text>

  <g transform="translate(138,210)" font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="0" y="-20" font-size="16" font-weight="700" fill="#334155">slower / lower cost</text>
    <text x="790" y="-20" font-size="16" font-weight="700" fill="#334155">faster / higher cost</text>
    <line x1="0" y1="250" x2="900" y2="250" stroke="#334155" stroke-width="4"/>
    <line x1="0" y1="245" x2="0" y2="255" stroke="#334155" stroke-width="4"/>
    <line x1="900" y1="245" x2="900" y2="255" stroke="#334155" stroke-width="4"/>

    <g>
      <circle cx="95" cy="250" r="56" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
      <text x="95" y="244" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">Ocean</text>
      <text x="95" y="270" text-anchor="middle" font-size="13" fill="#334155">low unit cost</text>
    </g>
    <g>
      <circle cx="285" cy="220" r="56" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
      <text x="285" y="214" text-anchor="middle" font-size="18" font-weight="700" fill="#14532d">Rail</text>
      <text x="285" y="240" text-anchor="middle" font-size="13" fill="#334155">efficient lanes</text>
    </g>
    <g>
      <circle cx="515" cy="180" r="56" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
      <text x="515" y="174" text-anchor="middle" font-size="18" font-weight="700" fill="#78350f">Truck</text>
      <text x="515" y="200" text-anchor="middle" font-size="13" fill="#334155">flexible</text>
    </g>
    <g>
      <circle cx="720" cy="118" r="56" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
      <text x="720" y="112" text-anchor="middle" font-size="18" font-weight="700" fill="#3b0764">Parcel</text>
      <text x="720" y="138" text-anchor="middle" font-size="13" fill="#334155">granular</text>
    </g>
    <g>
      <circle cx="860" cy="62" r="56" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
      <text x="860" y="56" text-anchor="middle" font-size="18" font-weight="700" fill="#7f1d1d">Air</text>
      <text x="860" y="82" text-anchor="middle" font-size="13" fill="#334155">fastest</text>
    </g>

    <rect x="90" y="330" width="760" height="62" rx="15" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="470" y="356" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">The cheapest lane can be expensive after delay, inventory, lost sales, and emissions are included.</text>
    <text x="470" y="381" text-anchor="middle" font-size="14" fill="#475569">Use landed cost plus service and working-capital effects.</text>
  </g>
</svg>
