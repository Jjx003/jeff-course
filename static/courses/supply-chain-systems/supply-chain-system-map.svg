<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Supply chain system map</title>
  <desc id="desc">A conceptual supply chain map showing physical flow downstream and information flow upstream across suppliers, plants, warehouses, retailers, and customers.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#25364d"/>
    </marker>
    <marker id="arrow2" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#b45309"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#172033" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="1200" height="720" fill="#f8fafc"/>
  <rect x="52" y="50" width="1096" height="620" rx="26" fill="#ffffff" stroke="#d8e0ea"/>
  <text x="86" y="105" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#152033">Supply chain as a coupled system</text>
  <text x="86" y="141" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" fill="#526273">Physical flow, information flow, buffers, and incentives interact across time.</text>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" filter="url(#shadow)">
    <g>
      <rect x="90" y="260" width="150" height="110" rx="18" fill="#dbeafe" stroke="#3b82f6"/>
      <text x="165" y="307" text-anchor="middle" font-size="21" font-weight="700" fill="#12315d">Suppliers</text>
      <text x="165" y="337" text-anchor="middle" font-size="15" fill="#334155">materials</text>
    </g>
    <g>
      <rect x="300" y="260" width="150" height="110" rx="18" fill="#dcfce7" stroke="#16a34a"/>
      <text x="375" y="307" text-anchor="middle" font-size="21" font-weight="700" fill="#14532d">Plants</text>
      <text x="375" y="337" text-anchor="middle" font-size="15" fill="#334155">capacity</text>
    </g>
    <g>
      <rect x="510" y="260" width="150" height="110" rx="18" fill="#fef3c7" stroke="#d97706"/>
      <text x="585" y="307" text-anchor="middle" font-size="21" font-weight="700" fill="#78350f">Warehouses</text>
      <text x="585" y="337" text-anchor="middle" font-size="15" fill="#334155">buffers</text>
    </g>
    <g>
      <rect x="720" y="260" width="150" height="110" rx="18" fill="#ede9fe" stroke="#7c3aed"/>
      <text x="795" y="307" text-anchor="middle" font-size="21" font-weight="700" fill="#3b0764">Retailers</text>
      <text x="795" y="337" text-anchor="middle" font-size="15" fill="#334155">promise</text>
    </g>
    <g>
      <rect x="930" y="260" width="150" height="110" rx="18" fill="#fee2e2" stroke="#dc2626"/>
      <text x="1005" y="307" text-anchor="middle" font-size="21" font-weight="700" fill="#7f1d1d">Customers</text>
      <text x="1005" y="337" text-anchor="middle" font-size="15" fill="#334155">demand</text>
    </g>
  </g>

  <g fill="none" stroke="#25364d" stroke-width="5" marker-end="url(#arrow)">
    <path d="M242 315 H292"/>
    <path d="M452 315 H502"/>
    <path d="M662 315 H712"/>
    <path d="M872 315 H922"/>
  </g>
  <text x="584" y="238" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#25364d">physical flow downstream</text>

  <path d="M1000 438 C845 536 376 536 166 438" fill="none" stroke="#b45309" stroke-width="5" stroke-dasharray="12 10" marker-end="url(#arrow2)"/>
  <text x="585" y="552" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#92400e">orders, forecasts, status, and risk signals flow upstream</text>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect x="118" y="440" width="210" height="78" rx="14" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="223" y="472" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">lead time</text>
    <text x="223" y="496" text-anchor="middle" font-size="14" fill="#475569">delay between decision and usable output</text>
    <rect x="390" y="440" width="210" height="78" rx="14" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="495" y="472" text-anchor="middle" font-size="17" font-weight="700" fill="#14532d">buffers</text>
    <text x="495" y="496" text-anchor="middle" font-size="14" fill="#475569">inventory, slack, options, cash</text>
    <rect x="662" y="440" width="210" height="78" rx="14" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="767" y="472" text-anchor="middle" font-size="17" font-weight="700" fill="#7c2d12">incentives</text>
    <text x="767" y="496" text-anchor="middle" font-size="14" fill="#475569">local metrics shape behavior</text>
  </g>
</svg>
