<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Sourcing risk matrix</title>
  <desc id="desc">A sourcing matrix comparing supply criticality and supplier concentration, showing routine buying, leverage, bottleneck, and strategic risk zones.</desc>
  <rect width="1200" height="720" fill="#f8fafc"/>
  <rect x="64" y="54" width="1072" height="612" rx="24" fill="#ffffff" stroke="#d8e0ea"/>
  <text x="94" y="110" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#152033">Sourcing is a portfolio of risks and options</text>
  <text x="94" y="145" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" fill="#526273">Unit price is only one term in the supplier decision.</text>

  <g transform="translate(210,190)" font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect x="0" y="0" width="760" height="420" fill="#ffffff" stroke="#334155" stroke-width="3"/>
    <line x1="380" y1="0" x2="380" y2="420" stroke="#cbd5e1" stroke-width="3"/>
    <line x1="0" y1="210" x2="760" y2="210" stroke="#cbd5e1" stroke-width="3"/>
    <rect x="0" y="210" width="380" height="210" fill="#ecfdf5"/>
    <rect x="380" y="210" width="380" height="210" fill="#eff6ff"/>
    <rect x="0" y="0" width="380" height="210" fill="#fef3c7"/>
    <rect x="380" y="0" width="380" height="210" fill="#fee2e2"/>

    <text x="190" y="104" text-anchor="middle" font-size="25" font-weight="700" fill="#92400e">Bottleneck</text>
    <text x="190" y="136" text-anchor="middle" font-size="16" fill="#475569">low spend, high operational risk</text>
    <text x="570" y="104" text-anchor="middle" font-size="25" font-weight="700" fill="#991b1b">Strategic</text>
    <text x="570" y="136" text-anchor="middle" font-size="16" fill="#475569">qualify, collaborate, protect access</text>
    <text x="190" y="314" text-anchor="middle" font-size="25" font-weight="700" fill="#14532d">Routine</text>
    <text x="190" y="346" text-anchor="middle" font-size="16" fill="#475569">automate and simplify</text>
    <text x="570" y="314" text-anchor="middle" font-size="25" font-weight="700" fill="#1e3a8a">Leverage</text>
    <text x="570" y="346" text-anchor="middle" font-size="16" fill="#475569">compete suppliers, manage cost</text>

    <text x="380" y="470" text-anchor="middle" font-size="18" font-weight="700" fill="#334155">supplier concentration and spend impact</text>
    <text x="-70" y="210" transform="rotate(-90 -70 210)" text-anchor="middle" font-size="18" font-weight="700" fill="#334155">supply criticality and recovery difficulty</text>
    <text x="28" y="454" font-size="15" fill="#64748b">low</text>
    <text x="718" y="454" font-size="15" fill="#64748b">high</text>
    <text x="-104" y="405" font-size="15" fill="#64748b">low</text>
    <text x="-110" y="25" font-size="15" fill="#64748b">high</text>
  </g>
</svg>
