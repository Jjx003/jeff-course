<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Circular supply chain loop</title>
  <desc id="desc">A circular supply chain loop showing design, sourcing, production, use, returns, sorting, remanufacturing, recycling, and disposal leakage.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#0f766e"/>
    </marker>
  </defs>
  <rect width="1200" height="720" fill="#f8fafc"/>
  <rect x="64" y="54" width="1072" height="612" rx="24" fill="#ffffff" stroke="#d8e0ea"/>
  <text x="94" y="110" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#152033">Circularity requires reverse logistics</text>
  <text x="94" y="145" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" fill="#526273">Returned products need sorting, repair, remanufacturing, recycling, and honest leakage accounting.</text>

  <g transform="translate(130,190)" font-family="Inter, Segoe UI, Arial, sans-serif">
    <path d="M210 92 C390 0 660 0 830 104" fill="none" stroke="#0f766e" stroke-width="6" marker-end="url(#arrow)"/>
    <path d="M890 160 C985 310 930 450 770 522" fill="none" stroke="#0f766e" stroke-width="6" marker-end="url(#arrow)"/>
    <path d="M700 552 C500 630 270 575 150 455" fill="none" stroke="#0f766e" stroke-width="6" marker-end="url(#arrow)"/>
    <path d="M112 390 C25 250 50 150 160 104" fill="none" stroke="#0f766e" stroke-width="6" marker-end="url(#arrow)"/>

    <g>
      <rect x="105" y="62" width="190" height="82" rx="16" fill="#ccfbf1" stroke="#14b8a6" stroke-width="3"/>
      <text x="200" y="96" text-anchor="middle" font-size="18" font-weight="700" fill="#134e4a">Design</text>
      <text x="200" y="120" text-anchor="middle" font-size="13" fill="#475569">repairable products</text>
    </g>
    <g>
      <rect x="405" y="35" width="190" height="82" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
      <text x="500" y="69" text-anchor="middle" font-size="18" font-weight="700" fill="#14532d">Produce</text>
      <text x="500" y="93" text-anchor="middle" font-size="13" fill="#475569">efficient conversion</text>
    </g>
    <g>
      <rect x="720" y="115" width="190" height="82" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
      <text x="815" y="149" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">Use</text>
      <text x="815" y="173" text-anchor="middle" font-size="13" fill="#475569">customer service life</text>
    </g>
    <g>
      <rect x="700" y="450" width="220" height="82" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
      <text x="810" y="484" text-anchor="middle" font-size="18" font-weight="700" fill="#78350f">Returns and Sort</text>
      <text x="810" y="508" text-anchor="middle" font-size="13" fill="#475569">inspect quality state</text>
    </g>
    <g>
      <rect x="350" y="500" width="240" height="82" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
      <text x="470" y="534" text-anchor="middle" font-size="18" font-weight="700" fill="#3b0764">Remanufacture</text>
      <text x="470" y="558" text-anchor="middle" font-size="13" fill="#475569">recover usable value</text>
    </g>
    <g>
      <rect x="80" y="375" width="210" height="82" rx="16" fill="#ecfeff" stroke="#06b6d4" stroke-width="3"/>
      <text x="185" y="409" text-anchor="middle" font-size="18" font-weight="700" fill="#155e75">Recycle</text>
      <text x="185" y="433" text-anchor="middle" font-size="13" fill="#475569">materials loop</text>
    </g>

    <path d="M900 492 C980 500 1025 535 1040 600" fill="none" stroke="#dc2626" stroke-width="5" stroke-dasharray="10 8"/>
    <text x="1015" y="630" text-anchor="middle" font-size="16" font-weight="700" fill="#991b1b">disposal leakage</text>
  </g>
</svg>
