<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Newsvendor critical fractile</title>
  <desc id="desc">A demand distribution with the critical fractile marked, showing underage and overage costs.</desc>
  <rect width="1200" height="720" fill="#f8fafc"/>
  <rect x="64" y="54" width="1072" height="612" rx="24" fill="#ffffff" stroke="#d8e0ea"/>
  <text x="94" y="110" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#152033">Critical fractile chooses the order quantity</text>
  <text x="94" y="145" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" fill="#526273">Order at the percentile implied by underage and overage costs.</text>

  <g transform="translate(150,205)">
    <line x1="0" y1="360" x2="900" y2="360" stroke="#334155" stroke-width="3"/>
    <line x1="0" y1="30" x2="0" y2="360" stroke="#334155" stroke-width="3"/>
    <text x="450" y="410" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#334155">demand</text>
    <text x="-54" y="190" transform="rotate(-90 -54 190)" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#334155">probability density</text>

    <path d="M35 360 C116 348 160 300 215 215 C274 124 345 80 430 104 C505 126 560 208 622 278 C675 338 760 354 860 360" fill="#bfdbfe"/>
    <path d="M35 360 C116 348 160 300 215 215 C274 124 345 80 430 104 C505 126 560 208 622 278 C675 338 760 354 860 360" fill="none" stroke="#2563eb" stroke-width="5"/>

    <line x1="560" y1="80" x2="560" y2="360" stroke="#dc2626" stroke-width="5"/>
    <text x="560" y="62" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#991b1b">Q*</text>
    <path d="M560 360 H860" stroke="#dc2626" stroke-width="4" stroke-dasharray="8 8"/>
    <path d="M35 360 H560" stroke="#16a34a" stroke-width="4" stroke-dasharray="8 8"/>

    <g font-family="Inter, Segoe UI, Arial, sans-serif">
      <rect x="96" y="30" width="270" height="82" rx="14" fill="#f0fdf4" stroke="#bbf7d0"/>
      <text x="231" y="63" text-anchor="middle" font-size="17" font-weight="700" fill="#14532d">shortage side</text>
      <text x="231" y="88" text-anchor="middle" font-size="14" fill="#475569">underage cost Cu</text>

      <rect x="642" y="90" width="270" height="82" rx="14" fill="#fef2f2" stroke="#fecaca"/>
      <text x="777" y="123" text-anchor="middle" font-size="17" font-weight="700" fill="#991b1b">leftover side</text>
      <text x="777" y="148" text-anchor="middle" font-size="14" fill="#475569">overage cost Co</text>

      <rect x="310" y="255" width="360" height="74" rx="16" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="490" y="287" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">service fractile = Cu / (Cu + Co)</text>
      <text x="490" y="312" text-anchor="middle" font-size="14" fill="#475569">the economics set the percentile target</text>
    </g>
  </g>
</svg>
