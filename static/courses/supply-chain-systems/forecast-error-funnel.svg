<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Forecast error funnel</title>
  <desc id="desc">A forecast error funnel showing uncertainty widening with longer planning horizons and decision examples at different horizons.</desc>
  <rect width="1200" height="720" fill="#f8fafc"/>
  <rect x="64" y="54" width="1072" height="612" rx="24" fill="#ffffff" stroke="#d8e0ea"/>
  <text x="94" y="110" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#152033">Forecast error grows with horizon</text>
  <text x="94" y="145" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" fill="#526273">Forecasts should be judged against the decision they support.</text>

  <g transform="translate(120,190)">
    <line x1="0" y1="380" x2="920" y2="380" stroke="#334155" stroke-width="3"/>
    <line x1="0" y1="20" x2="0" y2="380" stroke="#334155" stroke-width="3"/>
    <text x="460" y="430" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#334155">planning horizon</text>
    <text x="-58" y="200" transform="rotate(-90 -58 200)" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#334155">forecast uncertainty</text>

    <path d="M55 200 C205 120 355 82 515 58 C660 38 782 30 890 24" fill="none" stroke="#2563eb" stroke-width="5"/>
    <path d="M55 200 C205 280 355 318 515 342 C660 362 782 370 890 376" fill="none" stroke="#2563eb" stroke-width="5"/>
    <path d="M55 200 C250 203 520 202 890 200" fill="none" stroke="#0f172a" stroke-width="4" stroke-dasharray="10 8"/>
    <path d="M55 200 C205 120 355 82 515 58 C660 38 782 30 890 24 L890 376 C782 370 660 362 515 342 C355 318 205 280 55 200 Z" fill="#3b82f6" opacity="0.13"/>

    <g font-family="Inter, Segoe UI, Arial, sans-serif">
      <rect x="44" y="290" width="174" height="78" rx="14" fill="#eff6ff" stroke="#bfdbfe"/>
      <text x="131" y="322" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">days</text>
      <text x="131" y="346" text-anchor="middle" font-size="14" fill="#475569">labor and routes</text>

      <rect x="354" y="290" width="190" height="78" rx="14" fill="#ecfeff" stroke="#a5f3fc"/>
      <text x="449" y="322" text-anchor="middle" font-size="16" font-weight="700" fill="#155e75">weeks</text>
      <text x="449" y="346" text-anchor="middle" font-size="14" fill="#475569">replenishment</text>

      <rect x="690" y="290" width="210" height="78" rx="14" fill="#fef3c7" stroke="#fde68a"/>
      <text x="795" y="322" text-anchor="middle" font-size="16" font-weight="700" fill="#78350f">months</text>
      <text x="795" y="346" text-anchor="middle" font-size="14" fill="#475569">capacity and sourcing</text>
    </g>
  </g>
</svg>
