<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Network capacity map</title>
  <desc id="desc">A directed supply network with suppliers, plants, warehouse, and demand, showing arc capacities and a binding warehouse outbound lane.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155"/>
    </marker>
    <marker id="redarrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="1200" height="720" fill="#f8fafc"/>
  <rect x="64" y="54" width="1072" height="612" rx="24" fill="#ffffff" stroke="#d8e0ea"/>
  <text x="94" y="110" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#152033">Capacity binds on arcs, not slogans</text>
  <text x="94" y="145" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" fill="#526273">A max-flow model identifies which lane, facility, or supplier limits customer fulfillment.</text>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#334155">
    <path d="M190 250 C310 205 390 205 490 250" fill="none" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="336" y="205">25</text>
    <path d="M190 410 C310 455 390 455 490 410" fill="none" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="336" y="482">25</text>
    <path d="M190 250 C300 335 390 360 490 410" fill="none" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="330" y="342">20</text>
    <path d="M190 410 C300 325 390 300 490 250" fill="none" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="330" y="292">15</text>
    <path d="M630 250 C710 278 770 292 835 318" fill="none" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="720" y="270">30</text>
    <path d="M630 410 C710 382 770 368 835 342" fill="none" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="720" y="420">20</text>
    <path d="M630 250 C760 210 905 220 1010 302" fill="none" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="820" y="214">10</text>
    <path d="M630 410 C760 450 905 440 1010 358" fill="none" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="820" y="470">15</text>
    <path d="M890 330 H1000" fill="none" stroke="#dc2626" stroke-width="7" marker-end="url(#redarrow)"/>
    <text x="927" y="313" fill="#991b1b">35</text>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <g>
      <circle cx="165" cy="250" r="56" fill="#dbeafe" stroke="#3b82f6" stroke-width="3"/>
      <text x="165" y="244" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">Supplier</text>
      <text x="165" y="267" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">A</text>
    </g>
    <g>
      <circle cx="165" cy="410" r="56" fill="#dbeafe" stroke="#3b82f6" stroke-width="3"/>
      <text x="165" y="404" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">Supplier</text>
      <text x="165" y="427" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">B</text>
    </g>
    <g>
      <circle cx="555" cy="250" r="56" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
      <text x="555" y="244" text-anchor="middle" font-size="17" font-weight="700" fill="#14532d">Plant</text>
      <text x="555" y="267" text-anchor="middle" font-size="17" font-weight="700" fill="#14532d">1</text>
    </g>
    <g>
      <circle cx="555" cy="410" r="56" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
      <text x="555" y="404" text-anchor="middle" font-size="17" font-weight="700" fill="#14532d">Plant</text>
      <text x="555" y="427" text-anchor="middle" font-size="17" font-weight="700" fill="#14532d">2</text>
    </g>
    <g>
      <circle cx="860" cy="330" r="60" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
      <text x="860" y="324" text-anchor="middle" font-size="17" font-weight="700" fill="#78350f">Warehouse</text>
      <text x="860" y="348" text-anchor="middle" font-size="14" fill="#78350f">buffer</text>
    </g>
    <g>
      <rect x="1005" y="280" width="116" height="100" rx="20" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
      <text x="1063" y="323" text-anchor="middle" font-size="18" font-weight="700" fill="#7f1d1d">Demand</text>
      <text x="1063" y="349" text-anchor="middle" font-size="14" fill="#7f1d1d">sink</text>
    </g>
  </g>

  <rect x="130" y="560" width="840" height="54" rx="14" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="550" y="594" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#9a3412">The red lane is saturated: more upstream output does not help until outbound capacity improves.</text>
</svg>
