<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Resilience scenario portfolio</title>
  <desc id="desc">A resilience portfolio chart plotting disruption probability against impact and showing mitigations for different risk types.</desc>
  <rect width="1200" height="720" fill="#f8fafc"/>
  <rect x="64" y="54" width="1072" height="612" rx="24" fill="#ffffff" stroke="#d8e0ea"/>
  <text x="94" y="110" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#152033">Resilience is a portfolio problem</text>
  <text x="94" y="145" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" fill="#526273">Compare probability, impact, recovery time, and mitigation value.</text>

  <g transform="translate(155,205)" font-family="Inter, Segoe UI, Arial, sans-serif">
    <line x1="0" y1="390" x2="890" y2="390" stroke="#334155" stroke-width="3"/>
    <line x1="0" y1="390" x2="0" y2="20" stroke="#334155" stroke-width="3"/>
    <text x="445" y="440" text-anchor="middle" font-size="18" font-weight="700" fill="#334155">annual probability</text>
    <text x="-60" y="205" transform="rotate(-90 -60 205)" text-anchor="middle" font-size="18" font-weight="700" fill="#334155">business impact</text>

    <rect x="0" y="20" width="890" height="390" fill="#ffffff"/>
    <path d="M0 390 L890 20" stroke="#e2e8f0" stroke-width="4"/>
    <text x="710" y="72" font-size="15" font-weight="700" fill="#64748b">higher expected loss</text>

    <g>
      <circle cx="620" cy="250" r="58" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
      <text x="620" y="243" text-anchor="middle" font-size="16" font-weight="700" fill="#78350f">port</text>
      <text x="620" y="265" text-anchor="middle" font-size="16" font-weight="700" fill="#78350f">closure</text>
    </g>
    <g>
      <circle cx="405" cy="205" r="64" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
      <text x="405" y="198" text-anchor="middle" font-size="16" font-weight="700" fill="#7f1d1d">supplier</text>
      <text x="405" y="220" text-anchor="middle" font-size="16" font-weight="700" fill="#7f1d1d">quality</text>
    </g>
    <g>
      <circle cx="250" cy="105" r="72" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
      <text x="250" y="98" text-anchor="middle" font-size="16" font-weight="700" fill="#3b0764">regional</text>
      <text x="250" y="120" text-anchor="middle" font-size="16" font-weight="700" fill="#3b0764">outage</text>
    </g>

    <rect x="530" y="318" width="280" height="58" rx="14" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="670" y="342" text-anchor="middle" font-size="15" font-weight="700" fill="#9a3412">alternate routing</text>
    <text x="670" y="364" text-anchor="middle" font-size="13" fill="#475569">raises logistics option value</text>
    <rect x="330" y="300" width="300" height="58" rx="14" fill="#fef2f2" stroke="#fecaca"/>
    <text x="480" y="324" text-anchor="middle" font-size="15" font-weight="700" fill="#991b1b">qualified second source</text>
    <text x="480" y="346" text-anchor="middle" font-size="13" fill="#475569">reduces single-point failure</text>
    <rect x="78" y="205" width="315" height="58" rx="14" fill="#f5f3ff" stroke="#ddd6fe"/>
    <text x="235" y="229" text-anchor="middle" font-size="15" font-weight="700" fill="#5b21b6">backup power and inventory</text>
    <text x="235" y="251" text-anchor="middle" font-size="13" fill="#475569">extends time to survive</text>
  </g>
</svg>
