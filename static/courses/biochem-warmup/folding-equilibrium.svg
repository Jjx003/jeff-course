<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 460" role="img" aria-labelledby="title desc">
  <title id="title">Two state folding equilibrium</title>
  <desc id="desc">A free energy diagram showing folded and unfolded states with populations set by free energy difference.</desc>
  <rect width="860" height="460" fill="#f8fafc"/>
  <text x="430" y="48" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a">Equilibrium is a population, not a verdict</text>
  <line x1="110" y1="370" x2="760" y2="370" stroke="#475569" stroke-width="2"/>
  <line x1="110" y1="370" x2="110" y2="90" stroke="#475569" stroke-width="2"/>
  <text x="38" y="230" text-anchor="middle" transform="rotate(-90 38 230)" font-family="Inter, Arial, sans-serif" font-size="20" fill="#0f172a">free energy G</text>
  <path d="M150 315 C230 315 252 204 340 204 C428 204 442 315 522 315" fill="none" stroke="#2563eb" stroke-width="6"/>
  <path d="M522 315 C600 315 626 136 724 136" fill="none" stroke="#2563eb" stroke-width="6"/>
  <circle cx="210" cy="315" r="8" fill="#16a34a"/>
  <circle cx="700" cy="145" r="8" fill="#ef4444"/>
  <g font-family="Inter, Arial, sans-serif" fill="#0f172a">
    <text x="210" y="348" text-anchor="middle" font-size="22">folded basin</text>
    <text x="700" y="116" text-anchor="middle" font-size="22">unfolded ensemble</text>
    <text x="454" y="184" text-anchor="middle" font-size="18" fill="#475569">barrier affects rate</text>
    <line x1="700" y1="145" x2="700" y2="315" stroke="#ef4444" stroke-width="3" stroke-dasharray="8 8"/>
    <line x1="210" y1="315" x2="700" y2="315" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 8"/>
    <text x="724" y="235" font-size="20" fill="#ef4444">G_U - G_F</text>
    <text x="430" y="418" text-anchor="middle" font-size="20" fill="#475569">lower free energy means higher equilibrium population</text>
  </g>
</svg>
