<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" role="img" aria-labelledby="title desc">
  <title id="title">Alanine enantiomers</title>
  <desc id="desc">Schematic mirror-image alanine configurations emphasizing non-superimposable chirality.</desc>
  <rect width="860" height="430" fill="#f8fafc"/>
  <text x="430" y="48" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a">Same atoms, different handedness</text>
  <line x1="430" y1="86" x2="430" y2="360" stroke="#94a3b8" stroke-width="3" stroke-dasharray="8 10"/>
  <text x="430" y="388" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" fill="#475569">mirror plane</text>
  <g font-family="Inter, Arial, sans-serif" font-size="22" stroke-linecap="round" stroke-width="5">
    <g transform="translate(235 220)">
      <circle cx="0" cy="0" r="28" fill="#ffffff" stroke="#0f172a" stroke-width="3"/>
      <text x="0" y="8" text-anchor="middle" fill="#0f172a">C</text>
      <line x1="-20" y1="-20" x2="-110" y2="-92" stroke="#2563eb"/>
      <line x1="20" y1="-20" x2="110" y2="-92" stroke="#16a34a"/>
      <line x1="-22" y1="20" x2="-105" y2="100" stroke="#f97316"/>
      <path d="M24 18 L112 72 L94 96 L16 28 Z" fill="#e11d48"/>
      <text x="-150" y="-96" fill="#2563eb">NH3+</text>
      <text x="128" y="-96" fill="#16a34a">COO-</text>
      <text x="-142" y="122" fill="#f97316">H</text>
      <text x="120" y="100" fill="#e11d48">CH3</text>
      <text x="0" y="160" text-anchor="middle" font-weight="700" fill="#0f172a">L-alanine</text>
    </g>
    <g transform="translate(625 220)">
      <circle cx="0" cy="0" r="28" fill="#ffffff" stroke="#0f172a" stroke-width="3"/>
      <text x="0" y="8" text-anchor="middle" fill="#0f172a">C</text>
      <line x1="20" y1="-20" x2="110" y2="-92" stroke="#2563eb"/>
      <line x1="-20" y1="-20" x2="-110" y2="-92" stroke="#16a34a"/>
      <line x1="22" y1="20" x2="105" y2="100" stroke="#f97316"/>
      <path d="M-24 18 L-112 72 L-94 96 L-16 28 Z" fill="#e11d48"/>
      <text x="128" y="-96" fill="#2563eb">NH3+</text>
      <text x="-178" y="-96" fill="#16a34a">COO-</text>
      <text x="120" y="122" fill="#f97316">H</text>
      <text x="-172" y="100" fill="#e11d48">CH3</text>
      <text x="0" y="160" text-anchor="middle" font-weight="700" fill="#0f172a">D-alanine</text>
    </g>
  </g>
</svg>
