<svg width="300" height="150" viewBox="0 0 300 150" xmlns="http://www.w3.org/2000/svg">
  <!-- Fractions -->
  <g font-family="Arial" font-size="16" fill="#E2E8F0" text-anchor="middle">
    <text x="50" y="75">1</text>
    <line x1="35" y1="82" x2="65" y2="82" stroke="#CBD5E0" stroke-width="1" />
    <text x="50" y="100">a₀ + 1/a₁</text>
    
    <text x="120" y="40">pₖ</text>
    <line x1="105" y1="47" x2="135" y2="47" stroke="#CBD5E0" stroke-width="1" />
    <text x="120" y="65">qₖ</text>

    <text x="200" y="75">≈ α</text>
  </g>

  <!-- Rectangles visual (nested) -->
  <rect x="20" y="20" width="100" height="100" fill="none" stroke="#4A5568" stroke-dasharray="2" />
  <rect x="20" y="20" width="60" height="60" fill="none" stroke="#4299E1" stroke-width="1.5" />
  <rect x="20" y="20" width="40" height="40" fill="none" stroke="#63B3ED" stroke-width="1.2" />
  <rect x="20" y="20" width="25" height="25" fill="none" stroke="#90CDF4" stroke-width="1" />
  
  <text x="150" y="130" font-family="Arial" font-size="12" fill="#A0AEC0" text-anchor="middle">Best Rational Approximations</text>
</svg>
