<svg width="400" height="200" viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Number Line -->
  <line x1="20" y1="100" x2="380" y2="100" stroke="#CBD5E0" stroke-width="2" marker-end="url(#arrowhead)" />
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#CBD5E0" />
    </marker>
  </defs>

  <!-- Integers -->
  <g fill="#A0AEC0" font-family="Arial" font-size="12" text-anchor="middle">
    <circle cx="50" cy="100" r="3" fill="#A0AEC0" /> <text x="50" y="120">0</text>
    <circle cx="100" cy="100" r="3" fill="#A0AEC0" /> <text x="100" y="120">1</text>
    <circle cx="150" cy="100" r="3" fill="#A0AEC0" /> <text x="150" y="120">2</text>
    <circle cx="200" cy="100" r="3" fill="#A0AEC0" /> <text x="200" y="120">3</text>
    <circle cx="250" cy="100" r="3" fill="#A0AEC0" /> <text x="250" y="120">4</text>
    <circle cx="300" cy="100" r="3" fill="#A0AEC0" /> <text x="300" y="120">5</text>
    <circle cx="350" cy="100" r="3" fill="#A0AEC0" /> <text x="350" y="120">6</text>
  </g>

  <!-- Bezout's Line ax + by = d -->
  <path d="M 50 100 Q 125 30 200 100" fill="none" stroke="#F6AD55" stroke-width="2" stroke-dasharray="4" />
  <text x="125" y="45" font-family="Arial" font-size="12" fill="#F6AD55" text-anchor="middle">ax + by = gcd(a,b)</text>

  <!-- Labels -->
  <text x="360" y="90" font-family="Arial" font-size="12" fill="#A0AEC0">ℤ</text>
</svg>
