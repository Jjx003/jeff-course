<svg width="300" height="200" viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Level 0: Root -->
  <circle cx="150" cy="20" r="5" fill="#CBD5E0" />
  <text x="150" y="15" font-family="Arial" font-size="10" text-anchor="middle" fill="#A0AEC0">mod 1</text>

  <!-- Level 1: mod 2 -->
  <line x1="150" y1="20" x2="100" y2="70" stroke="#4A5568" stroke-width="1" />
  <line x1="150" y1="20" x2="200" y2="70" stroke="#4A5568" stroke-width="1" />
  <circle cx="100" cy="70" r="5" fill="#4299E1" />
  <circle cx="200" cy="70" r="5" fill="#4299E1" />
  <text x="100" y="85" font-family="Arial" font-size="10" text-anchor="middle" fill="#E2E8F0">0</text>
  <text x="200" y="85" font-family="Arial" font-size="10" text-anchor="middle" fill="#E2E8F0">1</text>
  <text x="25" y="70" font-family="Arial" font-size="10" fill="#A0AEC0">mod 2</text>

  <!-- Level 2: mod 4 -->
  <line x1="100" y1="70" x2="75" y2="130" stroke="#4A5568" stroke-width="1" />
  <line x1="100" y1="70" x2="125" y2="130" stroke="#4A5568" stroke-width="1" />
  <line x1="200" y1="70" x2="175" y2="130" stroke="#4A5568" stroke-width="1" />
  <line x1="200" y1="70" x2="225" y2="130" stroke="#4A5568" stroke-width="1" />
  
  <circle cx="75" cy="130" r="4" fill="#63B3ED" />
  <circle cx="125" cy="130" r="4" fill="#63B3ED" />
  <circle cx="175" cy="130" r="4" fill="#63B3ED" />
  <circle cx="225" cy="130" r="4" fill="#63B3ED" />
  
  <text x="75" y="145" font-family="Arial" font-size="9" text-anchor="middle" fill="#E2E8F0">0</text>
  <text x="125" y="145" font-family="Arial" font-size="9" text-anchor="middle" fill="#E2E8F0">2</text>
  <text x="175" y="145" font-family="Arial" font-size="9" text-anchor="middle" fill="#E2E8F0">1</text>
  <text x="225" y="145" font-family="Arial" font-size="9" text-anchor="middle" fill="#E2E8F0">3</text>
  <text x="25" y="130" font-family="Arial" font-size="10" fill="#A0AEC0">mod 4</text>

  <!-- Dots for deeper levels -->
  <text x="75" y="170" font-family="Arial" font-size="14" text-anchor="middle" fill="#4A5568">...</text>
  <text x="125" y="170" font-family="Arial" font-size="14" text-anchor="middle" fill="#4A5568">...</text>
  <text x="175" y="170" font-family="Arial" font-size="14" text-anchor="middle" fill="#4A5568">...</text>
  <text x="225" y="170" font-family="Arial" font-size="14" text-anchor="middle" fill="#4A5568">...</text>
</svg>
