   <g id="text_7">
    <text style="font-size: 9px; font-family: 'Segoe UI', 'DejaVu Sans'; fill: #0f172a" transform="translate(148.826813 200.019552)">What each removes</text>
    <text style="font-size: 9px; font-family: 'Segoe UI', 'DejaVu Sans'; fill: #0f172a" transform="translate(95.578453 210.41587)">DPO: the reward model and the sampling loop</text>
    <text style="font-size: 9px; font-family: 'Segoe UI', 'DejaVu Sans'; fill: #0f172a" transform="translate(84.247594 221.818361)">GRPO: the value network, replaced by a group mean</text>
   </g>
   <g id="text_8">
    <text style="font-size: 9px; font-family: 'Segoe UI', 'DejaVu Sans'; fill: #0f172a" transform="translate(547.369828 200.019552)">Where each is used</text>
    <text style="font-size: 9px; font-family: 'Segoe UI', 'DejaVu Sans'; fill: #0f172a" transform="translate(477.136781 210.463683)">DPO: cheap alignment when you have preference pairs</text>
    <text style="font-size: 9px; font-family: 'Segoe UI', 'DejaVu Sans'; fill: #0f172a" transform="translate(479.525297 221.866173)">GRPO: verifiable-reward RL — maths, code, reasoning</text>
   </g>
   <g id="text_9">
    <text style="font-size: 12px; font-family: 'Segoe UI', 'DejaVu Sans'; text-anchor: middle; fill: #0f172a" x="403.2" y="21.24" transform="rotate(-0 403.2 21.24)">Post-training: what each method drops from the one before</text>
   </g>
  </g>
  <g id="text_10">
   <text style="font-size: 9.5px; font-family: 'Segoe UI', 'DejaVu Sans'; fill: #475569" transform="translate(9.6768 274.850322)">The classic RLHF pipeline is the top row. DPO reparameterizes the RLHF objective so the optimal policy can be trained directly on</text>
   <text style="font-size: 9.5px; font-family: 'Segoe UI', 'DejaVu Sans'; fill: #475569" transform="translate(9.6768 288.274082)">preference pairs, deleting both the reward model and the sampling loop. GRPO keeps online RL but replaces the learned value network</text>
   <text style="font-size: 9.5px; font-family: 'Segoe UI', 'DejaVu Sans'; fill: #475569" transform="translate(9.6768 301.647373)">with the mean reward of a sampled group, which is what makes large-scale verifiable-reward training affordable.</text>
  </g>
 </g>
