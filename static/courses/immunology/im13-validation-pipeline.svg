<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="t d"><title id="t">Systems immunology validation pipeline</title><desc id="d">Discovery progresses through patient-level split, external validation, prospective utility, and perturbation.</desc><rect width="960" height="430" fill="#f8fafc"/><style>text{font-family:Arial,sans-serif;fill:#172033}.h{font-size:20px;font-weight:bold}.b{font-size:14px}.box{fill:#fff;stroke:#475569;stroke-width:2}.gate{fill:#ecfdf5;stroke:#047857;stroke-width:2}.a{stroke:#2563eb;stroke-width:3;fill:none;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#2563eb"/></marker></defs><text class="h" x="30" y="38">A model earns stronger claims at each gate</text>
<rect class="box" x="30" y="80" rx="10" width="150" height="85"/><text class="h" x="50" y="110">Discovery</text><text class="b" x="50" y="137">multi-omic features</text><rect class="gate" x="225" y="80" rx="10" width="150" height="85"/><text class="h" x="245" y="110">Split</text><text class="b" x="245" y="137">patient, then site</text><rect class="gate" x="420" y="80" rx="10" width="150" height="85"/><text class="h" x="440" y="110">Validate</text><text class="b" x="440" y="137">calibration + PR</text><rect class="gate" x="615" y="80" rx="10" width="150" height="85"/><text class="h" x="635" y="110">Use</text><text class="b" x="635" y="137">changes a decision</text><rect class="gate" x="810" y="80" rx="10" width="120" height="85"/><text class="h" x="830" y="110">Test</text><text class="b" x="830" y="137">perturb + rescue</text><path class="a" d="M180 122H225"/><path class="a" d="M375 122H420"/><path class="a" d="M570 122H615"/><path class="a" d="M765 122H810"/>
<rect class="box" x="80" y="250" rx="10" width="220" height="100"/><text class="h" x="100" y="282">Claim: association</text><text class="b" x="100" y="310">"feature differs"</text><rect class="box" x="370" y="250" rx="10" width="220" height="100"/><text class="h" x="390" y="282">Claim: prediction</text><text class="b" x="390" y="310">"feature transports"</text><rect class="box" x="660" y="250" rx="10" width="220" height="100"/><text class="h" x="680" y="282">Claim: mechanism</text><text class="b" x="680" y="310">"changing feature changes outcome"</text><path class="a" d="M300 300H370"/><path class="a" d="M590 300H660"/><text class="b" x="80" y="395">More modalities improve a claim only when links, uncertainty, and independent units survive the pipeline.</text></svg>
