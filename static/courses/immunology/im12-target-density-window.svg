<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="t d"><title id="t">CAR target-density window</title><desc id="d">Healthy and disease antigen density distributions compared with receptor activation thresholds.</desc><rect width="960" height="420" fill="#f8fafc"/><style>text{font-family:Arial,sans-serif;fill:#172033}.h{font-size:20px;font-weight:bold}.b{font-size:14px}.axis{stroke:#334155;stroke-width:2}.healthy{fill:#38bdf8;fill-opacity:.45;stroke:#0284c7;stroke-width:2}.disease{fill:#fb7185;fill-opacity:.4;stroke:#be123c;stroke-width:2}.line{stroke:#7c3aed;stroke-width:3;stroke-dasharray:8 6}</style><text class="h" x="35" y="38">Target density defines the therapeutic window</text><line class="axis" x1="80" y1="340" x2="900" y2="340"/><line class="axis" x1="80" y1="340" x2="80" y2="75"/><text class="b" x="780" y="378">antigen molecules / cell</text><text class="b" x="18" y="92" transform="rotate(-90 18 92)">cell frequency</text><path class="healthy" d="M95 340 C170 338 190 150 285 120 C380 150 400 338 485 340Z"/><path class="disease" d="M410 340 C500 338 555 100 675 86 C795 100 820 338 900 340Z"/><line class="line" x1="365" y1="70" x2="365" y2="340"/><line class="line" x1="545" y1="70" x2="545" y2="340"/><text class="b" x="220" y="110">healthy cells</text><text class="b" x="670" y="78">disease cells</text><text class="b" x="275" y="62">high-affinity threshold</text><text class="b" x="550" y="62">tuned threshold</text><text class="b" x="120" y="402">Moving the threshold left increases sensitivity and collateral recognition; moving it right can spare healthy cells but permit dim-target escape.</text></svg>
