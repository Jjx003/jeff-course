<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc">
  <title id="title">Primary immune response, contraction, memory, and booster recall timeline</title>
  <desc id="desc">Innate signals peak first, effectors and plasmablasts rise next, germinal-center activity and antibody persist longer, most effectors contract, memory remains, and a booster causes a faster larger recall response.</desc>
  <defs><style>.h{font:700 19px system-ui;fill:#0f172a}.t{font:14px system-ui;fill:#334155}.axis{stroke:#475569;stroke-width:2}.grid{stroke:#cbd5e1;stroke-width:1;stroke-dasharray:5 6}</style></defs>
  <rect width="1000" height="540" rx="24" fill="#f8fafc"/>
  <text x="45" y="43" class="h">RELATIVE RESPONSE</text><line x1="85" y1="465" x2="950" y2="465" class="axis"/><line x1="85" y1="80" x2="85" y2="465" class="axis"/>
  <g class="grid"><line x1="220" y1="80" x2="220" y2="465"/><line x1="390" y1="80" x2="390" y2="465"/><line x1="610" y1="80" x2="610" y2="465"/><line x1="790" y1="80" x2="790" y2="465"/></g>
  <text x="75" y="500" class="t">day 0</text><text x="200" y="500" class="t">day 7</text><text x="365" y="500" class="t">day 28</text><text x="575" y="500" class="t">months</text><text x="765" y="500" class="t">booster</text><text x="905" y="500" class="t">recall</text>
  <path d="M85 450 C110 180 155 120 220 420 C300 450 500 450 610 450" fill="none" stroke="#dc2626" stroke-width="5"/><text x="105" y="105" class="t" fill="#dc2626">innate signals</text>
  <path d="M85 450 C150 450 175 150 245 130 C310 150 350 350 470 425 C560 445 650 440 790 435 C830 425 850 120 915 105" fill="none" stroke="#7c3aed" stroke-width="5"/><text x="250" y="120" class="t">effector cells</text>
  <path d="M85 450 C125 445 180 260 240 230 C330 185 430 205 520 300 C610 355 680 370 790 365 C840 280 875 180 930 165" fill="none" stroke="#d97706" stroke-width="5"/><text x="350" y="190" class="t">antibody</text>
  <path d="M85 450 C180 450 215 330 300 260 C390 215 485 270 560 370 C640 420 700 420 790 420" fill="none" stroke="#0891b2" stroke-width="5"/><text x="350" y="255" class="t">germinal center</text>
  <path d="M85 450 C260 450 350 435 460 405 C570 380 680 380 790 380 C845 330 885 255 935 240" fill="none" stroke="#16a34a" stroke-width="6"/><text x="505" y="365" class="t">memory pool</text>
  <line x1="790" y1="70" x2="790" y2="465" stroke="#0f172a" stroke-width="3"/><text x="805" y="92" class="h">RE-EXPOSURE</text>
  <rect x="105" y="515" width="18" height="5" fill="#dc2626"/><text x="130" y="523" class="t">alarm</text><rect x="205" y="515" width="18" height="5" fill="#7c3aed"/><text x="230" y="523" class="t">effectors</text><rect x="330" y="515" width="18" height="5" fill="#d97706"/><text x="355" y="523" class="t">antibody</text><rect x="460" y="515" width="18" height="5" fill="#0891b2"/><text x="485" y="523" class="t">selection</text><rect x="590" y="515" width="18" height="5" fill="#16a34a"/><text x="615" y="523" class="t">memory</text>
</svg>
