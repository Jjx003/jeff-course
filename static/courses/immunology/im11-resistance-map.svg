<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="t d"><title id="t">Tumor resistance map</title><desc id="d">Resistance mechanisms aligned to antigen, presentation, access, and effector function.</desc><rect width="960" height="430" fill="#f8fafc"/><style>text{font-family:Arial,sans-serif;fill:#172033}.h{font-size:19px;font-weight:bold}.b{font-size:14px}.box{fill:#fff;stroke:#64748b;stroke-width:2}.r{fill:#fff1f2;stroke:#be123c;stroke-width:2}.a{stroke:#334155;stroke-width:3;fill:none;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#334155"/></marker></defs>
<text x="30" y="38" class="h">Locate resistance before selecting a combination</text>
<rect class="box" x="30" y="75" rx="10" width="180" height="80"/><text class="h" x="50" y="105">Antigen</text><text class="b" x="50" y="132">clonality, expression</text>
<rect class="box" x="270" y="75" rx="10" width="180" height="80"/><text class="h" x="290" y="105">Presentation</text><text class="b" x="290" y="132">HLA, B2M, processing</text>
<rect class="box" x="510" y="75" rx="10" width="180" height="80"/><text class="h" x="530" y="105">Access</text><text class="b" x="530" y="132">vessels, stroma, space</text>
<rect class="box" x="750" y="75" rx="10" width="180" height="80"/><text class="h" x="770" y="105">Effector state</text><text class="b" x="770" y="132">checkpoint, metabolism</text>
<path class="a" d="M210 115H270"/><path class="a" d="M450 115H510"/><path class="a" d="M690 115H750"/>
<rect class="r" x="30" y="220" rx="10" width="180" height="110"/><text class="h" x="50" y="252">Escape</text><text class="b" x="50" y="278">antigen loss</text><text class="b" x="50" y="300">subclone outgrowth</text>
<rect class="r" x="270" y="220" rx="10" width="180" height="110"/><text class="h" x="290" y="252">Invisible</text><text class="b" x="290" y="278">HLA/B2M loss</text><text class="b" x="290" y="300">IFN pathway defect</text>
<rect class="r" x="510" y="220" rx="10" width="180" height="110"/><text class="h" x="530" y="252">Excluded</text><text class="b" x="530" y="278">fibroblast barrier</text><text class="b" x="530" y="300">abnormal vessels</text>
<rect class="r" x="750" y="220" rx="10" width="180" height="110"/><text class="h" x="770" y="252">Suppressed</text><text class="b" x="770" y="278">PD-1 axis</text><text class="b" x="770" y="300">myeloid ecology</text>
<path class="a" d="M120 220V158"/><path class="a" d="M360 220V158"/><path class="a" d="M600 220V158"/><path class="a" d="M840 220V158"/>
<text class="b" x="30" y="385">Biopsy result -> repaired step -> combination -> added toxicity. A plausible drug without this chain is not a mechanism-led combination.</text></svg>
